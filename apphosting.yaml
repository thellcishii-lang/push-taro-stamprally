  - variable: NEXT_PUBLIC_FIREBASE_VAPID_KEY
    value: BHUa5JSl4Wo_NUFmIrh9wuMtomCeu7XmEfsIUW0HQQJwAZB8zEV-WuDGbzsG7hXd-v4Bj_UZyQvQqfoI1CWe23Y
